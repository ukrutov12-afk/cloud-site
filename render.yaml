# Render Blueprint — заливай репозиторий, Render подхватит этот файл.
# Free-тариф: ФС эфемерная → для постоянных аккаунтов задай DATABASE_URL
# (бесплатный Postgres: Neon/Supabase) в Environment сервиса на Render.
services:
  - type: web
    name: zephyr-client
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true   # Render сам сгенерит секрет
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PURCHASES_FROZEN
        value: "false"
      # Telegram-уведомления о запусках лаунчера (без IP). Секреты — только здесь.
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
