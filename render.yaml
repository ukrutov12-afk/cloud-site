# Render Blueprint — заливай репозиторий, Render подхватит этот файл.
# Free-тариф: ФС эфемерная → для постоянных аккаунтов задай DATABASE_URL
# (бесплатный Postgres: Neon/Supabase) в Environment сервиса на Render.
services:
  - type: web
    name: zephyr-client
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true   # Render сам сгенерит секрет
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PURCHASES_FROZEN
        value: "false"
      # Telegram-уведомления о запусках лаунчера (без IP). Секреты — только здесь.
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      # Секрет вебхука бота (setWebhook secret_token) — иначе payload подделывается.
      - key: TG_WEBHOOK_SECRET
        sync: false
      # Кто нажимает кнопки инцидентов (по умолчанию = TG_CHAT_ID).
      - key: TG_ADMIN_ID
        sync: false
      # Класс-стриминг (трек-A): ключ билда для расшифровки классов.
      - key: ZEPHYR_BUILD_KEY
        sync: false
      # Защита клиента: секрет приёма инцидентов (заголовок X-Zephyr-Secret).
      - key: ZEPHYR_PROTECT_SECRET
        sync: false
