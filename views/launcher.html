<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zephyr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/themes.css">
<style>
  /* Дизайн сайта Zephyr: Inter + палитра #090a0f + акцент из themes.css (violet/ice/acid/ember).
     launcher.css грузится ниже и уточняет .card/.field/.btn — цвета берём из общих токенов. */
  :root{
    --ink:#eeeef5; --muted:#a1a2b5; --muted-2:#818297;
    --bg:#090a0f; --inset:#0c0d14; --danger:#e97b87;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    background:radial-gradient(ellipse at 50% 22%,rgba(var(--accent-rgb),.08),transparent 62%),var(--bg);
    font:14px/1.5 Inter,system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  /* перетаскивание окна за верх (натив ловит .drag через инжектированный шим) */
  .drag{-webkit-app-region:drag; position:fixed; top:0; left:0; right:0; height:56px}
  .close{
    -webkit-app-region:no-drag; position:fixed; top:14px; right:16px; width:30px; height:30px;
    border:0; background:transparent; color:var(--muted-2); font-size:15px; cursor:pointer;
    border-radius:9px; transition:background .15s,color .15s; z-index:2;
  }
  .close:hover{background:rgba(255,255,255,.06); color:var(--ink)}
  .close:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  .card{
    width:min(360px,calc(100% - 40px)); padding:36px 34px; text-align:center;
    border:1px solid rgba(255,255,255,.1); border-radius:22px;
    background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.016));
    box-shadow:0 28px 80px #0006, inset 0 1px 0 #ffffff10;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    animation:enter .42s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes enter{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}

  .logo{
    width:56px; height:56px; border-radius:16px; margin:0 auto 16px; display:block;
    border:1px solid rgba(255,255,255,.12); box-shadow:0 0 34px rgba(var(--accent-rgb),.14);
  }
  .wordmark{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0}
  .sub{font-size:9px; color:var(--accent); letter-spacing:.34em; text-transform:uppercase; margin:7px 0 30px}

  .field{
    display:flex; align-items:center; height:46px; margin:11px 0;
    background:var(--inset); border:1px solid rgba(255,255,255,.12); border-radius:11px;
    transition:border-color .18s, box-shadow .18s;
  }
  .field:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.1)}
  .field input{
    flex:1; min-width:0; height:100%; padding:0 15px; border:0; outline:0; background:transparent;
    color:var(--ink); font:14px Inter,sans-serif;
  }
  .field input::placeholder{color:var(--muted-2)}

  .btn{
    width:100%; height:46px; margin-top:18px; border:0; border-radius:11px; cursor:pointer;
    background:var(--accent); color:var(--on-accent); font:650 13px Inter,sans-serif;
    letter-spacing:.01em; box-shadow:0 6px 26px rgba(var(--accent-rgb),.14);
    transition:background .18s, transform .18s, box-shadow .18s;
  }
  .btn:hover{background:var(--accent-hi); transform:translateY(-1px); box-shadow:0 8px 32px rgba(var(--accent-rgb),.24)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:disabled{background:rgba(255,255,255,.06); color:var(--muted-2); cursor:default; box-shadow:none; transform:none}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  .status{min-height:18px; margin-top:16px; font-size:12px; color:var(--muted); line-height:1.6; overflow-wrap:anywhere}
  .status.err{color:var(--danger)}
  .status.ok{color:var(--accent-hi)}

  .bar{height:3px; margin-top:14px; border-radius:2px; background:var(--inset); overflow:hidden; opacity:0; transition:opacity .2s}
  .bar.on{opacity:1}
  .bar > i{display:block; height:100%; width:38%; background:var(--accent); border-radius:2px; animation:slide 1s linear infinite}
  @keyframes slide{from{transform:translateX(-110%)} to{transform:translateX(320%)}}

  .foot{position:fixed; bottom:16px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted-2); letter-spacing:.14em; pointer-events:none}

  @media(prefers-reduced-motion:reduce){.card,.bar>i,.btn{animation:none; transition:none}}
</style>
<link rel="stylesheet" href="/css/launcher.css">
</head>
<body>
  <div class="drag"></div>
  <button class="close" onclick="nativeClose()" aria-label="Закрыть">✕</button>

  <div class="card">
    <img class="logo launcher-logo" src="/img/zephyr-avatar.jpg" width="56" height="56" alt="">
    <h1 class="wordmark">Zephyr</h1>
    <div class="sub">Client</div>

    <form id="f" autocomplete="off">
      <div class="field"><input id="user" placeholder="Логин или email" autocomplete="off"></div>
      <div class="field"><input id="pass" type="password" placeholder="Пароль" autocomplete="off"></div>
      <button class="btn" id="go" type="submit">Войти</button>
    </form>

    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status"></div>
  </div>

  <div class="foot" id="foot">v1.0</div>

<script>
  const inWebView2 = !!(window.chrome && window.chrome.webview);
  const $ = id => document.getElementById(id);

  function setStatus(text, cls){ const s=$('status'); s.textContent=text; s.className='status '+(cls||''); }
  function busy(on){ $('go').disabled=on; $('bar').classList.toggle('on',on); }
  function nativeClose(){ if(inWebView2) window.chrome.webview.postMessage({type:'close'}); }

  // Натив присылает статус (успех/ошибка авторизации, ход запуска)
  if(inWebView2){
    window.chrome.webview.addEventListener('message', e=>{
      const m = e.data || {};
      if(m.type==='status'){ busy(!!m.busy); setStatus(m.text, m.kind); }
    });
  }

  $('f').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const user=$('user').value.trim(), pass=$('pass').value;
    if(!user||!pass){ setStatus('Введите логин и пароль','err'); return; }
    busy(true); setStatus('Проверка…');

    if(inWebView2){
      // натив сам сделает auth с HWID и запустит игру; токен/ключ в JS не попадают
      window.chrome.webview.postMessage({type:'login', user, pass});
      return;
    }
    // режим обычного браузера — предпросмотр дизайна + проверка backend сайта
    try{
      const r = await fetch('/api/launcher/auth', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({login:user, password:pass, hwid:'DEV-HWID'})
      });
      const j = await r.json();
      busy(false);
      if(j.ok) setStatus('Авторизовано (dev-режим, без нативного запуска)','ok');
      else setStatus(j.message||'Отказано','err');
    }catch(e){ busy(false); setStatus('Сервер недоступен','err'); }
  });
</script>
</body>
</html>
