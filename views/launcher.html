<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zephyr</title>
<style>
  :root{
    --bg:#0f1013; --panel:#18151c; --inset:#121016; --edge:#2a2630;
    --accent:#8f6dfa; --accent-hi:#a588fb; --text:#e6e6ea; --muted:#8a8a93; --danger:#e0616b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.4 "Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  /* перетаскивание окна за верх (натив ловит .drag через инжектированный шим) */
  .drag{-webkit-app-region:drag; position:fixed; top:0; left:0; right:0; height:56px}
  .close{
    -webkit-app-region:no-drag; position:fixed; top:14px; right:16px; width:28px; height:28px;
    border:0; background:transparent; color:var(--muted); font-size:15px; cursor:pointer; border-radius:8px;
  }
  .close:hover{background:var(--panel); color:var(--text)}
  .card{width:360px; padding:0 40px; text-align:center}
  .wordmark{font-size:30px; font-weight:700; letter-spacing:.06em; margin:0}
  .sub{font-size:11px; color:var(--muted); letter-spacing:.28em; margin:6px 0 34px}
  .field{
    display:flex; align-items:center; height:44px; margin:10px 0;
    background:var(--inset); border:1px solid var(--edge); border-radius:12px;
    transition:border-color .15s;
  }
  .field:focus-within{border-color:var(--accent)}
  .field input{
    flex:1; height:100%; padding:0 14px; border:0; outline:0; background:transparent;
    color:var(--text); font:14px "Segoe UI",sans-serif;
  }
  .field input::placeholder{color:var(--muted)}
  .btn{
    width:100%; height:44px; margin-top:16px; border:0; border-radius:12px; cursor:pointer;
    background:var(--accent); color:#fff; font:600 14px "Segoe UI",sans-serif;
    transition:background .15s;
  }
  .btn:hover{background:var(--accent-hi)}
  .btn:disabled{background:var(--edge); color:var(--muted); cursor:default}
  .status{min-height:18px; margin-top:16px; font-size:12px; color:var(--muted)}
  .status.err{color:var(--danger)}
  .status.ok{color:var(--accent)}
  .bar{height:3px; margin-top:14px; border-radius:2px; background:var(--inset); overflow:hidden; opacity:0; transition:opacity .2s}
  .bar.on{opacity:1}
  .bar > i{display:block; height:100%; width:40%; background:var(--accent); animation:slide 1s linear infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
  .foot{position:fixed; bottom:16px; left:0; right:0; text-align:center; font-size:10px; color:#3a3540}
</style>
</head>
<body>
  <div class="drag"></div>
  <button class="close" onclick="nativeClose()">✕</button>

  <div class="card">
    <h1 class="wordmark">ZEPHYR</h1>
    <div class="sub">CLIENT</div>

    <form id="f" autocomplete="off">
      <div class="field"><input id="user" placeholder="Логин или email" autocomplete="off"></div>
      <div class="field"><input id="pass" type="password" placeholder="Пароль" autocomplete="off"></div>
      <button class="btn" id="go" type="submit">Войти</button>
    </form>

    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status"></div>
  </div>

  <div class="foot" id="foot">v1.0</div>

<script>
  const inWebView2 = !!(window.chrome && window.chrome.webview);
  const $ = id => document.getElementById(id);

  function setStatus(text, cls){ const s=$('status'); s.textContent=text; s.className='status '+(cls||''); }
  function busy(on){ $('go').disabled=on; $('bar').classList.toggle('on',on); }
  function nativeClose(){ if(inWebView2) window.chrome.webview.postMessage({type:'close'}); }

  // Натив присылает статус (успех/ошибка авторизации, ход запуска)
  if(inWebView2){
    window.chrome.webview.addEventListener('message', e=>{
      const m = e.data || {};
      if(m.type==='status'){ busy(!!m.busy); setStatus(m.text, m.kind); }
    });
  }

  $('f').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const user=$('user').value.trim(), pass=$('pass').value;
    if(!user||!pass){ setStatus('Введите логин и пароль','err'); return; }
    busy(true); setStatus('Проверка…');

    if(inWebView2){
      // натив сам сделает auth с HWID и запустит игру; токен/ключ в JS не попадают
      window.chrome.webview.postMessage({type:'login', user, pass});
      return;
    }
    // режим обычного браузера — предпросмотр дизайна + проверка backend сайта
    try{
      const r = await fetch('/api/launcher/auth', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({login:user, password:pass, hwid:'DEV-HWID'})
      });
      const j = await r.json();
      busy(false);
      if(j.ok) setStatus('Авторизовано (dev-режим, без нативного запуска)','ok');
      else setStatus(j.message||'Отказано','err');
    }catch(e){ busy(false); setStatus('Сервер недоступен','err'); }
  });
</script>
</body>
</html>
